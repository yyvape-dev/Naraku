}
function win(){mode='victory';if(R)commitBattle();showResult(true,'')}
function lose(why){if(mode==='defeat')return;mode='defeat';aim.on=false;showResult(false,why)}

/* ---- モジュールB：探索（網の目マップと灯火）。マップの形も各マスの結果も、探索のシードだけで決まる ---- */
function genMap(seed){
  const r=mulberry32(hash32(seed^0x7A3D11C5));
  const steps=XCFG.stepsMin+Math.floor(r()*(XCFG.stepsMax-XCFG.stepsMin+1));
  // 数歩ごとに1マスへ収束する：中継キャンプ（道のりが長ければ2か所）と、最後のボス部屋
  const camps=steps>=9?[Math.round(steps/3),Math.round(steps*2/3)]:[Math.ceil(steps/2)];
  const nodes=[],layers=[];
  for(let L=0;L<=steps;L++){
    const single=L===0||L===steps||camps.indexOf(L)>=0,row=[];let n=1;
    if(!single){let tot=0;for(const k in XCFG.rowW)tot+=XCFG.rowW[k];let q=r()*tot;for(const k in XCFG.rowW){q-=XCFG.rowW[k];if(q<0){n=+k;break}}if(n<2)n=2}
    for(let i=0;i<n;i++){
      const id=nodes.length;
      nodes.push({id,L,i,n,type:L===0?'start':L===steps?'boss':single?'camp':'battle',next:[],prev:[],seed:hash32(seed^Math.imul(id+1,0x9E3779B1)),jx:r()-0.5,jy:r()-0.5,hint:'',ev:-1});
      row.push(id);
    }
    layers.push(row);
  }
  // 道：1歩ごとに2〜3分岐（収束先が1マスのときだけ1本。4マスの段へは近い2〜3マスへ）。近いマスどうしを結ぶ
  const link=(a,b)=>{if(nodes[a].next.indexOf(b)<0){nodes[a].next.push(b);nodes[b].prev.push(a)}};
  for(let L=0;L<steps;L++){
    const a=layers[L],b=layers[L+1],pos=i=>a.length===1?(b.length-1)/2:i/(a.length-1)*(b.length-1);
    a.forEach((id,i)=>{
      const c=pos(i),order=b.map((t,j)=>({t,d:Math.abs(j-c)+r()*0.01})).sort((p,q)=>p.d-q.d);
      const k=a.length===1?b.length:Math.min(b.length,2+(r()<0.3?1:0));
      for(let j=0;j<k;j++)link(id,order[j].t);
    });
    b.forEach((t,j)=>{ // 誰からも行けないマスを残さない
      if(nodes[t].prev.length)return;
      let best=a[0],bd=1e9;a.forEach((id,i)=>{const d=Math.abs(j-pos(i));if(d<bd){bd=d;best=id}});link(best,t);
    });
  }
  nodes.forEach(n=>n.next.sort((p,q)=>p-q));
  // マスの種類：どの段にも戦闘を1つは置く。強敵と焚き火は2歩目から。ボスの手前は焚き火が出やすい
  for(let L=1;L<steps;L++){
    const row=layers[L];if(row.length===1)continue;
    const used={};let fight=false;
    row.forEach(id=>{
      const w=[['battle',46],['elite',L>=2?13:0],['chest',used.chest?0:13],['event',18],['rest',L>=2&&!used.rest?(L===steps-1?22:10):0]];
      let tot=0;for(const o of w)tot+=o[1];
      let q=r()*tot,t='battle';for(const o of w){q-=o[1];if(q<0){t=o[0];break}}
      nodes[id].type=t;used[t]=true;if(t==='battle'||t==='elite')fight=true;
    });
    if(!fight)nodes[row[Math.floor(r()*row.length)]].type='battle';
  }
  // 予兆の文と、異変の中身（同じ異変が続かないよう、山札から順に配る）
  const deck=EVENTS.map((e,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(r()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}
  let en=0;
  nodes.forEach(n=>{
    const own=HINTS[n.type];if(!own)return;
    const amb=AMBIG.filter(h=>h.t.indexOf(n.type)>=0);
    n.hint=(amb.length&&r()<XCFG.ambig)?amb[Math.floor(r()*amb.length)].s:own[Math.floor(r()*own.length)];
    if(n.type==='event')n.ev=deck[en++%deck.length];
  });
  return{seed,steps,camps,layers,nodes};
}
function newRun(seed,floor){
  R={seed,floor:floor||1,map:genMap(seed),at:0,from:0,light:100,gold:0,loot:[],done:{},amb:null,sel:null,walk:null,seen:{0:true},trail:{},wins:0,stock:{},node:null,end:null,cleared:false,flash:0,land:0,camY:null}; // flash・land・camY は見た目だけ（暗闇の明滅・着地の輪・盤の流れ）
}
const lightState=()=>R.light>=XCFG.lightClear?'clear':R.light>=XCFG.lightDim?'dim':'dark';
const partyAlive=()=>P.members.some(m=>!m.collapsed);
const pm=v=>(v>0?'+':'−')+Math.abs(v);
// 現在地から2歩先までに行けるマス（id→歩数）
function reach2(){
  const out={},nd=R.map.nodes,cur=nd[R.at];
  cur.next.forEach(a=>{out[a]=1});
  cur.next.forEach(a=>nd[a].next.forEach(b=>{if(!out[b])out[b]=2}));
  return out;
}
/* マスがどこまで見えるか。灯りの残量で、2歩先までの情報量が3段階に変わる。
   full=正体が見える / hint=予兆の文だけ / none=何も見えない / far=2歩より先（形だけ） */
function nodeInfo(id,near){
  const n=R.map.nodes[id],d=NODES[n.type],ls=lightState();
  if(R.seen[id])return{lv:'full',g:d.g,name:d.name,text:d.desc,col:d.col,ix:MEDAL_IX[n.type]};
  if(!(near||reach2())[id])return{lv:'far',g:'',name:'未踏',text:'まだ見通せない',col:'#5a5040',ix:-1};
  if(ls==='clear')return{lv:'full',g:d.g,name:d.name,text:d.desc,col:d.col,ix:MEDAL_IX[n.type]};
  if(ls==='dim')return{lv:'hint',g:'？',name:'気配',text:n.hint,col:'#a89878',ix:MEDAL_UNK};
  return{lv:'none',g:'？',name:'？？？？',text:'暗くて何も見えない',col:'#7a62a8',ix:MEDAL_UNK};
}
// 生存者全員の狂気を増減する。100%に達した味方は精神崩壊する（戻り値は崩壊した味方）
function addMad(v){
  const fell=[];
  for(const m of P.members){
    if(m.collapsed)continue;
    m.madness=clamp(m.madness+v,0,100);if(v>0)m.surge=true;
    if(m.madness>=100){m.collapsed=true;m.hpR=0;fell.push(m)}
  }
  return fell;
}
function healAll(f){for(const m of P.members)if(!m.collapsed)m.hpR=clamp(m.hpR+f,0.05,1)} // 探索中の出来事で体力が尽きることはない
function addLight(v){R.light=clamp(R.light+v,0,100)}
const nodeLv=n=>R.floor-1+(R.map.steps>1?clamp((n.L-1)/(R.map.steps-1),0,1):0);
function applyFx(fx,n){
  const out=[];
  if(fx.gold){R.gold=Math.max(0,R.gold+fx.gold);out.push('金 '+pm(fx.gold))}
  if(fx.gear){n=n||R.map.nodes[R.at];for(let k=0;k<fx.gear;k++){const it=mkItem(mulberry32(hash32(n.seed^0x6D2B79F5^Math.imul(k+1,0x9E3779B1))),nodeLv(n),0);R.loot.push(it);out.push('装備：'+itemName(it))}}
  if(fx.light){addLight(fx.light);out.push('灯り '+pm(fx.light)+'%')}
  if(fx.heal){healAll(fx.heal);out.push(fx.heal>=1?'全員の体力が全快した':'全員の体力 +'+Math.round(fx.heal*100)+'%')}
  if(fx.hurt){healAll(-fx.hurt);out.push('全員の体力 −'+Math.round(fx.hurt*100)+'%')}
  if(fx.mad){const fell=addMad(fx.mad);out.push('全員の狂気 '+pm(fx.mad)+'%');fell.forEach(m=>out.push(CHARS[m.id].short+'が精神崩壊した'))}
  return out;
}
function canGo(id){return mode==='map'&&!R.walk&&R.map.nodes[R.at].next.indexOf(id)>=0}
// 1歩進む：灯りが減り、暗闇に入っていれば全員の狂気が増える
function stepTo(id){
  if(!canGo(id))return false;
  R.from=R.at;R.at=id;R.seen[id]=true;R.trail[R.from+'>'+id]=true;R.sel=null;
  addLight(-XCFG.lightStep);
  if(lightState()==='dark'){addMad(XCFG.darkMad);R.flash=1}
  saveRun();
  return true;
}
function arrive(){
  R.walk=null;
  if(!partyAlive()){endRun('mad');return}
  openNode(R.map.nodes[R.at]);
}
function startNodeBattle(n,kind){
  const dep=R.map.steps>1?(n.L-1)/(R.map.steps-1):0;
  R.node=null;beginBattle(kind==='ambush'?hash32(n.seed^0x0A3B5C7D):n.seed,{kind,depth:dep,bg:bgFor(dep,kind),floor:R.floor});
}
function openNode(n){
  const t=n.type;
  if(t==='battle'||t==='elite'||t==='boss'){startNodeBattle(n,t);return}
  mode='node';
  if(t==='chest'){
    const r=mulberry32(hash32(n.seed^0x4C1D2E3F)),fx={gold:XCFG.chestGold+Math.floor(r()*XCFG.chestGold)+n.L*10};
    if(r()<0.45)fx.gear=1;
    if(r()<0.4)fx.light=XCFG.oilFind;
    R.node={n,phase:'done',title:'宝箱',text:'朽ちた宝箱を見つけた。錠は、とうに壊れている。'+(fx.light?'底には油の小瓶も転がっていた。':''),res:applyFx(fx,n),ambush:false};R.done[n.id]=true;saveRun();
  }else if(t==='rest'){
    R.node={n,phase:'pick',title:'焚き火',text:'誰かが残した焚き火が、まだ燃えている。ここなら少しだけ休めそうだ。',opts:REST};
  }else if(t==='event'){
    const ev=EVENTS[n.ev];R.node={n,phase:'pick',title:ev.name,text:ev.text,opts:ev.opts};
  }else{ // 中継キャンプ：商人の在庫はキャンプごと。着いたときに少し回復する
    const first=!R.stock[n.id];
    if(first){R.stock[n.id]={};SHOP.forEach(s=>{R.stock[n.id][s.id]=s.stock});healAll(XCFG.campHeal)}
    R.node={n,phase:'shop',first,last:''};saveRun();
  }
  showNode();
}
function chooseNode(i){
  const N=R&&R.node;if(mode!=='node'||!N||N.phase!=='pick')return false;
  const o=N.opts[i];if(!o||(o.need&&R.gold<o.need))return false;
  let out=o;
  if(o.roll){ // 分かれ道の結果はマスのシードで決まる（選び直しても変わらない）
    let q=mulberry32(hash32(N.n.seed^0x2545F491))();out=o.roll[o.roll.length-1];
    for(const c of o.roll){q-=c.p;if(q<0){out=c;break}}
  }
  N.phase='done';N.text=out.say||'';N.res=applyFx(out.fx||{},N.n);N.ambush=!!(out.fx&&out.fx.ambush);
  if(N.ambush)R.amb=N.n.id;else R.done[N.n.id]=true;
  saveRun();
  showNode();return true;
}
function buyItem(id){
  const N=R&&R.node;if(mode!=='node'||!N||N.phase!=='shop')return false;
  const s=SHOP.find(x=>x.id===id),st=R.stock[N.n.id];
  if(!s||st[id]<=0||R.gold<s.price)return false;
  R.gold-=s.price;st[id]--;applyFx(s.fx);N.last=s.name+'を買った。'+s.note+'。';
  saveRun();showNode();return true;
}
function leaveNode(){
  const N=R&&R.node;if(mode!=='node'||!N||N.phase==='pick')return false;
  if(!partyAlive()){endRun('mad');return true}
  if(N.ambush){startNodeBattle(N.n,'ambush');return true}
  if(N.phase==='shop'){R.done[N.n.id]=true;saveRun()}
  R.node=null;mode='map';handSig='';elScreen.classList.remove('on');return true;
}
// 荷物（街の商店で買った物資）を、マップの上で使う
function askBag(){
  if(mode!=='map'||R.walk)return false;
  mode='node';R.node={n:R.map.nodes[R.at],phase:'bag',last:''};showNode();return true;
}
function useBag(id){
  const N=R&&R.node,s=SHOP.find(x=>x.id===id);if(mode!=='node'||!N||N.phase!=='bag'||!s||!(S.bag[id]>0))return false;
  S.bag[id]--;N.last=s.name+'を使った。'+applyFx(s.fx).join('、')+'。';saveRun();showNode();return true;
}
/* 探索の終わり。clear=ボス撃破 / return=途中で帰還 … 戦利品を持ち帰る。wipe=戦闘で全滅 / mad=全員が精神崩壊 … 未精算の戦利品をすべて失う。
   体力・狂気・崩壊は街へ持ち越す（P.members は街の記録そのもの）。戦闘で全滅したときは、生き残りが瀕死で街へ運ばれる */
function endRun(kind){
  const keep=kind==='clear'||kind==='return';
  R.end={kind,keep,gold:R.gold,loot:R.loot.slice(),auto:null,deeper:false};R.node=null;R.walk=null;
  S.runs++;S.day++;
  if(kind==='clear'){S.clears++;if(R.floor>=S.floorMax){S.floorMax=R.floor+1;S.floor=S.floorMax;R.end.deeper=true}}
  if(keep){S.gold+=R.gold;R.end.auto=bankLoot(R.loot)}
  if(kind==='wipe')for(const m of P.members)if(!m.collapsed)m.hpR=TCFG.wipeHp;
  S.run=null;save();
  mode='settle';showSettle();
}

// 絵の名前とコマ数から、緩急の表を選ぶ（コマ数が合わなければ仮の配分。それも無ければ等間隔）
function motionOf(name,n){const m=MOTION[name];return m&&m.ms.length===n?m:MOTION_DEF[n]||null}
/* 動きの進み具合 u（0〜1）から、映すコマを決める。hitU=命中の瞬間が動きの何割の時点か（null なら素の配分のまま）。
   ヒットより前のコマを 0〜hitU に、ヒット以降のコマを hitU〜1 に、それぞれ表の比のまま収める */
function frameAt(m,n,u,hitU){
  if(!m)return Math.min(n-1,Math.floor(u*n));
  const ms=m.ms;let tot=0,pre=0;for(let i=0;i<n;i++){tot+=ms[i];if(i<m.hit)pre+=ms[i]}
  const t=(hitU==null||hitU<=0||hitU>=1||pre<=0)?u*tot:u<hitU?u/hitU*pre:pre+(u-hitU)/(1-hitU)*(tot-pre);
  let acc=0;for(let i=0;i<n;i++){acc+=ms[i];if(t<acc)return i}
  return n-1;
}
// 見本の繰り返し再生（調整パネル）。素の速さで1周する
function frameLoop(m,n,T){if(!m)return Math.floor(T*8)%n;let tot=0;for(let i=0;i<n;i++)tot+=m.ms[i];return frameAt(m,n,(T*1000%tot)/tot,null)}
function blit(g,set,f,h){
  const fr=set.frames[f%set.frames.length],s=h/set.refH,ax=CFG.fix?fr.ax:fr.rax,ay=CFG.fix?fr.ay:fr.ray;
  g.drawImage(fr.c,-ax*s,-ay*s,fr.c.width*s,fr.c.height*s);
}
function mark(g,x,y){g.fillStyle='#39ff6a';g.fillRect(x-5,y-0.75,10,1.5);g.fillRect(x-0.75,y-5,1.5,10)}
function drawEnemy(g,e,T){

  else if(e.frzT<=0){
    if(e.st==='walk'){const w=Math.sin(T*(5+e.spd*0.08)+e.ph);bob=-Math.abs(w)*3.4;rot=w*0.065} // 歩き：速い敵ほど歩幅が速い。左右に体を振って足踏みに見せる
    else{const w=Math.sin(T*2.6+e.ph);bob=-Math.abs(w)*1.2;rot=w*0.02}                       // 交戦・詠唱中の待機：浅い息づき
  }

  g.save();g.translate(e.x+tn.x*e.sc,e.y+bob+tn.y*e.sc);g.rotate(rot);blit(g,set,f,h);
  if(e.flash>0){g.globalCompositeOperation='lighter';g.globalAlpha=0.75;blit(g,set,f,h)}
  g.restore();
  if(e.burnT>0){g.fillStyle='rgba(255,138,58,'+(0.2+Math.sin(T*22+e.ph)*0.08)+')';g.beginPath();g.ellipse(e.x,e.y-h*0.42,h*0.2,h*0.42,0,0,TAU);g.fill()}
  if(e.frzT>0){g.strokeStyle='#bfe9ff';g.lineWidth=1.5;g.beginPath();g.ellipse(e.x,e.y,h*0.3,h*0.11,0,0,TAU);g.stroke();g.fillStyle='rgba(143,216,255,.28)';g.fillRect(e.x-h*0.2,e.y-h*0.9,h*0.4,h*0.9)}
  else if(e.slowT>0){g.strokeStyle='#2fb89a';g.lineWidth=1.5;g.beginPath();g.ellipse(e.x,e.y,h*0.3,h*0.11,0,0,TAU);g.stroke()}
  if(e.hp<e.max&&!e.d.boss){const w=e.d.r*2;g.fillStyle='rgba(0,0,0,.7)';g.fillRect(e.x-w/2,e.y-h-7,w,3);g.fillStyle=e.elite?'#7fc4ff':'#d23a2e';g.fillRect(e.x-w/2,e.y-h-7,w*clamp(e.hp/e.max,0,1),3)}

function drawAlly(g,a,T){

function tableGeo(){

  const key=Math.round(H)+'|'+Math.round(ar.width)+'|'+Math.round(ar.height)+'|'+Math.round(ap.height);if(tableG&&tableG._k===key)return tableG;
  const k=W/ar.width,Aw=ap.width,Ah=ap.height,top=ar.top-ap.top,arH=ar.height,lft=ar.left-ap.left;

  const ih0=Aw*im.height/im.width,hud=MAP_HUD/k;

// 道：盤に打った鋲の列。mode=sel（選んだ道）/ walk（歩いた道）/ open（いま進める道）/ dim（その先）

      const L=b.h*Math.hypot(sx,sy),ang=Math.atan2(sy,sx),sg=g.createLinearGradient(0,0,L,0);sg.addColorStop(0,'rgba(24,14,5,.42)');sg.addColorStop(0.6,'rgba(24,14,5,.26)');sg.addColorStop(1,'rgba(24,14,5,0)');
      g.save();g.translate(X,base);g.rotate(ang);g.fillStyle=sg;g.beginPath();g.ellipse(L*0.5,0,L*0.52,b.w*0.2,0,0,TAU);g.fill();g.restore(); // 地面に落ちる影の、やわらかい広がり
      g.save();g.translate(X,base);g.transform(1.12,0,-sx,-sy,0,0);g.globalAlpha=m.collapsed?0.2:0.4;g.drawImage(b.sil,-b.w/2,-b.h+Math.round(b.h*0.035));g.restore(); // 駒の形の影
      g.fillStyle='rgba(24,14,5,.55)';g.beginPath();g.ellipse(X-b.w*0.05,base+b.h*0.02,b.w*0.36,b.h*0.06,0,0,TAU);g.fill();
      g.save();g.translate(X,Y-lifts[i]);if(m.collapsed){g.translate(Math.round(b.w*0.3),-Math.round(b.w*0.12));g.rotate(1.38);g.globalAlpha=0.6}
      g.drawImage(b.c,-Math.round(b.w/2),-b.h);g.restore();
    }
    // 体力と狂気（影に重ならないよう、頭の上に出す）
    const bw=Math.round(28*d),bx=X-Math.round(bw/2),by=Y-(b?b.h:Math.round(hp0))-Math.round(11*d);
    g.fillStyle='rgba(40,25,12,.86)';g.strokeStyle='rgba(201,168,90,.95)';g.lineWidth=Math.max(1,Math.round(d*0.75));g.beginPath();g.rect(bx-Math.round(2.5*d)+0.5,by-Math.round(2.5*d)+0.5,bw+Math.round(5*d)-1,Math.round(10*d)-1);g.fill();g.stroke();
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(bx,by,bw,Math.round(2.5*d));g.fillRect(bx,by+Math.round(3.5*d),bw,Math.round(2*d));
    g.fillStyle='#e0553f';g.fillRect(bx,by,Math.round(bw*(m.collapsed?0:m.hpR)),Math.round(2.5*d));g.fillStyle='#a37be0';g.fillRect(bx,by+Math.round(3.5*d),Math.round(bw*m.madness/100),Math.round(2*d));
  });
}

function facFx(now){

    }

      const m=D.motes;while(F.mote.length<m[4])F.mote.push({x:m[0]+Math.random()*(m[1]-m[0]),y:m[2]+Math.random()*(m[3]-m[2]),vx:(Math.random()-.5)*.5,vy:.15+Math.random()*.45,ph:Math.random()*6,s:.6+Math.random()*1.1});

// 検証用の、街と切り離したパーティ（全快・狂気0）。gear={w,a} を渡すと全員に同じ装備を持たせる
function makeParty(ids,gear){P={members:ids.map(id=>({id,madness:0,collapsed:false,surge:false,hpR:1,w:gear&&gear.w||null,a:gear&&gear.a||null})),rewinds:0}}
// 探索に出る（街の「出撃」）。出撃の3人は街の状態（体力・狂気・装備）をそのまま持っていく
function beginRun(seed){townParty();newRun(seed==null?newSeed():seed>>>0,S.floor);saveRun();enterMap()}
// 単発の戦闘（検証用）。opt を省くと、Step 2までと同じ条件の180秒戦になる
function beginTrial(ids,seed,opt){opt=opt||{};makeParty(ids,opt.gear);R=null;beginBattle(seed,{kind:opt.kind||'trial',depth:opt.depth||0,bg:opt.bg||null,floor:opt.floor||1})}
function enterMap(){
  if(tuning)closeTune();
  B=null;R.node=null;R.camY=null;mode='map';hideUp();app.classList.add('exploring');elScreen.classList.remove('on');
  $('#party').innerHTML=partyHTML();mountParty();
  resize();buildRail();handSig='';
}
function beginBattle(seed,opt){
  BOPT=opt||{kind:'trial',depth:0,bg:null};
  app.classList.remove('exploring');elHand.classList.remove('dest');
  B=null;resize();newBattle(seed==null?newSeed():seed>>>0);buildBG();buildRail();handSig='';accum=0;paused=false;
  setTxt($('#btnPause'),'一時停止');setTxt($('#btnSpeed'),speed===1?'等速':'倍速');
  elScreen.classList.remove('on');mode='battle';
  if(R){elRail.classList.remove('enter');void elRail.offsetWidth;elRail.classList.add('enter')} // 探索から戦闘へ：サイドエリアが右から入ってくる
  banner({battle:'敵襲',elite:'強敵の気配',boss:'奈落の主',ambush:'奇襲'}[B.kind]||'防衛開始');
}
// マップ上の移動（画面からの操作）。駒が滑って着いてから、そのマスが開く
function travel(id){if(!stepTo(id))return false;R.walk={from:R.from,t:0};return true}
function askRetreat(){
  if(mode!=='map'||R.walk)return false;
  mode='node';R.node={n:R.map.nodes[R.at],phase:'retreat'};showNode();return true;
}
function afterVictory(){
  if(mode!=='victory')return false;
  if(!R){beginBattle(null,BOPT);return true}
  if(R.cleared){endRun('clear');return true}
  enterMap();return true;
}
function giveUp(){
  if(mode!=='defeat')return false;
  if(R)endRun('wipe');else showTown();
  return true;
}
/* ---- 各マスの画面 ---- */
function showNode(){
  const N=R.node,n=N.n,d=NODES[n.type];let h;
  const head=(g,col,t,ix)=>'<div class="emb'+(UI.medals&&ix>=0?' mart':'')+'" style="--nc:'+col+(UI.medals&&ix>=0?';'+medalPos(ix):'')+'">'+g+'</div><h1>'+t+'</h1>',mix=MEDAL_IX[n.type];
  const purse='<div class="stats">未精算の金<b>'+R.gold+'</b>　装備<b>'+R.loot.length+'</b><br>灯り<b>'+R.light+'%</b></div>';
  if(N.phase==='retreat'){
    h=head('還','#b39355','街へ帰還する')+'<p>来た道を引き返し、探索を終えます。未精算の戦利品は、すべて持ち帰れます。</p>'+purse
      +'<div class="acts"><button data-act="retreat">帰還する</button><button class="sub" data-act="leave">探索に戻る</button></div>';
  }else if(N.phase==='bag'){
    h=head('荷','#b39355','荷物')+'<p>'+(N.last||'街の商店で買った物資です。使うとその場で効きます。')+'</p>'+purse+'<div class="acts">'
      +TSHOP.map(t=>{const s=SHOP.find(x=>x.id===t.id),c=S.bag[t.id];return'<button class="opt sub" data-use="'+t.id+'"'+(c>0?'':' disabled')+'>'+s.name+'を使う<small>'+s.note+'　所持 '+c+'</small></button>'}).join('')
      +'<button data-act="leave">荷物を閉じる</button></div>';
  }else if(N.phase==='shop'){
    const st=R.stock[n.id];
    h=head(d.g,d.col,d.name,mix)+'<p>'+(N.last||'焚き火のそばで、商人が荷をほどいて待っている。'+(N.first?'一息ついて、全員の体力が少し戻った。':''))+'</p>'+purse+'<div class="acts">'
      +SHOP.map(s=>'<button class="opt sub" data-buy="'+s.id+'"'+(st[s.id]>0&&R.gold>=s.price?'':' disabled')+'>'+s.name+'　金 '+s.price+'<small>'+s.note+'　'+(st[s.id]>0?'残り'+st[s.id]:'売り切れ')+'</small></button>').join('')
      +'<button data-act="leave">キャンプを発つ</button></div>';
  }else if(N.phase==='pick'){
    h=head(d.g,d.col,N.title,mix)+'<p>'+N.text+'</p><div class="acts">'
      +N.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'"'+(o.need&&R.gold<o.need?' disabled':'')+'>'+o.label+(o.note?'<small>'+o.note+'</small>':'')+'</button>').join('')+'</div>';
  }else{
    h=head(d.g,d.col,N.title,mix)+'<p>'+N.text+'</p>'+(N.res.length?'<p class="res">'+N.res.join('<br>')+'</p>':'')
      +'<div class="acts"><button data-act="leave">'+(!partyAlive()?'闇に呑まれる':N.ambush?'迎え撃つ':'先へ進む')+'</button></div>';
  }
  openScreen(h,true);
}
// 探索の精算。持ち帰った金と装備は街の蓄えに入り、体力・狂気・崩壊はそのまま街へ持ち越す
function showSettle(){
  const e=R.end,M=R.map,t={
    clear: ['奈落踏破','奈落の主を退け、夜が来る前に街へ戻りました。戦利品は、すべて持ち帰れます。'+(e.deeper?'さらに深い第'+S.floorMax+'層への道が開けました。':'')],
    return:['帰還','灯りが尽きる前に、来た道を引き返しました。戦利品は無事です。'],
    wipe:  ['全滅','前線は崩れました。未精算の戦利品は、すべて奈落に呑まれました。生き残った者は、瀕死で街へ運ばれます。'],
    mad:   ['精神崩壊','闇の中で、誰も正気を保てませんでした。未精算の戦利品は、すべて奈落に呑まれました。教会で蘇らせるまで、彼らは戻りません。']}[e.kind];
  openScreen('<h1'+(e.keep?'':' class="bad"')+'>'+t[0]+'</h1><p>'+t[1]+'</p>'
    +'<div class="stats">第'+R.floor+'層　歩み<b>'+M.nodes[R.at].L+' / '+M.steps+'</b>　勝利<b>'+R.wins+'戦</b><br>'+(e.keep?'持ち帰り':'失った戦利品')+'　金<b>'+e.gold+'</b>　装備<b>'+e.loot.length+'</b><br>街の蓄え　金<b>'+S.gold+'</b>　資材<b>'+S.mats+'</b></div>'
    +(e.keep?lootHTML(e.loot,'持ち帰った装備'):'')
    +(e.auto&&e.auto.n?'<p class="note">倉庫がいっぱいのため、弱い装備'+e.auto.n+'個を資材 +'+e.auto.y+' に変えました。</p>':'')
    +'<div class="acts"><button data-act="town">街へ戻る</button></div>',false);
}
// 結果画面：味方ごとの与ダメージ（毎秒＝合計÷戦闘時間）。棒は通常攻撃とスキルの内訳
function dpsHTML(){
  const t=Math.max(1,B.t),rows=B.allies.map(a=>{const s=B.stat[a.d.id];return{a,atk:s.atk/t,sk:s.skill/t,tot:(s.atk+s.skill)/t}});
  const top=Math.max(1,...rows.map(r=>r.tot)),sum=(rows.reduce((v,r)=>v+r.tot,0)+B.statX/t)||1;
  return'<div class="dps"><div class="dh">与ダメージ／秒<i></i>通常<i class="sk"></i>スキル</div>'+rows.map(r=>
    '<div class="dr'+(r.a.alive?'':' dead')+'"><canvas width="96" height="128" data-id="'+r.a.d.id+'"></canvas>'
    +'<div class="dn"><span>'+r.a.d.short+'</span><b>'+Math.round(r.tot)+'</b><small>/秒　'+Math.round(r.tot/sum*100)+'%</small></div>'
    +'<div class="db"><i style="width:'+(r.atk/top*100).toFixed(1)+'%;background:'+r.a.d.color+'"></i><i style="width:'+(r.sk/top*100).toFixed(1)+'%;background:#b39355"></i></div>'
    +'<div class="dd">通常 '+Math.round(r.atk)+'　スキル '+Math.round(r.sk)+'</div></div>').join('')
    +(B.statX>0?'<div class="dd" style="text-align:center">禁忌「奈落の裁き」 '+Math.round(B.statX/t)+'/秒</div>':'')+'</div>';
}
function showResult(ok,why){
  const st=dpsHTML()+'<div class="stats">撃破<b>'+B.kills+'</b>　強化<b>'+B.lv+'回</b><br>金<b>'+B.gold+'</b>　装備<b>'+B.loot.length+'</b><br>逆転の右手<b>'+P.rewinds+'回</b><br>'
    +(R?'未精算の合計　金<b>'+R.gold+'</b>　装備<b>'+R.loot.length+'</b>':'ドロップ署名<b>'+dropSig(B.seed)+'</b>')+'</div>'
    +(ok?lootHTML(B.loot,'手に入れた装備')+(B.reward?lootHTML([B.reward],'奈落の主を退けた報酬　金 +'+B.rewardGold):''):'');
  let h;
  if(ok){
    const back=R&&B.back.length?B.back.join('・')+'は戦闘不能から、体力'+Math.round(XCFG.reviveHp*100)+'%で戦列に戻りました。':'';
    h='<h1>'+(B.kind==='boss'?'奈落の主を退けた':'防衛成功')+'</h1><p>'+fmt(B.dur)+'を耐え抜きました。ソウル'+Math.floor(B.soul)+'は霧散し、戦利品だけが手元に残ります。'+back+'</p>'+st+'<div class="acts">'
      +(R?'<button data-act="next">'+(R.cleared?'戦利品を持ち帰る':'探索を続ける')+'</button>':'<button data-act="next">次の戦闘へ進む</button><button class="sub" data-act="town">街に戻る</button>')+'</div>';
  }else{
    const can=canRewind();
    h='<h1 class="bad">敗北</h1><p>'+why+'。'+(can?'逆転の右手を使えば、狂気と引き換えに戦闘開始まで時を戻せます。':'これ以上の狂気には誰も耐えられません。')+(R?'このまま力尽きれば、未精算の戦利品はすべて失われます。':'')+'</p>'+st
      +'<div class="acts"><button class="red" data-act="rewind"'+(can?'':' disabled')+'>逆転の右手を使う</button><button class="sub" data-act="'+(R?'giveup':'town')+'">'+(R?'力尽きる（戦利品を失う）':'街に戻る')+'</button></div>';
  }
  openScreen(h,false);
  elScreen.querySelectorAll('.dps canvas').forEach(c=>paintFace(c,c.dataset.id));
}
elScreen.addEventListener('click',ev=>{
  if(elScreen.classList.contains('town')){townClick(ev);return}
  if(elScreen.classList.contains('node')&&performance.now()-scrAt<250)return; // 誤タップ防止：マスの画面は、出た直後は選べない
  const op=ev.target.closest('[data-opt]');if(op){if(!op.disabled)chooseNode(+op.dataset.opt);return}
  const by=ev.target.closest('[data-buy]');if(by){if(!by.disabled)buyItem(by.dataset.buy);return}
  const us=ev.target.closest('[data-use]');if(us){if(!us.disabled)useBag(us.dataset.use);return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==='town')showTown();
  else if(act==='resume')resumeRun();
  else if(act==='next')afterVictory();
  else if(act==='giveup')giveUp();
  else if(act==='leave')leaveNode();
  else if(act==='retreat'){if(mode==='node'&&R.node&&R.node.phase==='retreat')endRun('return')}
  else if(act==='rewind')startRewind();
});

/* ---- ソウル強化の選択画面 ---- */
const elLv=$('#lvup');let lvOpenAt=0;
function buildLines(){ // 一時停止中に見せる、取得済みの強化（3つずつ改行）
  if(!B)return[];
  const it=UPS.filter(u=>B.up[u.id]).map(u=>u.name+(u.max>1?B.up[u.id]:'')),out=[];
  for(let i=0;i<it.length;i+=3)out.push(it.slice(i,i+3).join('　'));
  return out;
}
function showUp(){
  $('#lvTitle').textContent='魂の昇華 '+B.lv;
  $('#lvBuild').innerHTML=UPS.filter(u=>B.up[u.id]).map(u=>'<span style="--fc:'+FAMS[u.fam].col+'">'+u.name+(u.max>1?' '+B.up[u.id]:'')+'</span>').join('');
  const tc=tagCount();
  $('#lvCards').innerHTML=B.offer.map((u,i)=>{
    const f=FAMS[u.fam],lv=B.up[u.id]||0,ts=tabooState(u),own=UPARTS[u.id],art=own||UPARTS[u.fam];
    const rate=(u.fam==='phys'||u.fam==='mag')?'<em class="ur">出現率×'+(UPCFG.wTagBase+UPCFG.wTag*tc[u.fam]).toFixed(1)+'</em>':'';
    const lvTxt=u.id==='x_heal'?'　':u.max===1?'一度きり':'Lv '+lv+' → '+(lv+1)+(lv+1>=u.max?' 最大':'');
    const cost=ts?'<span class="uc">代償：狂気 +'+UPCFG.tabooMad+'%'+(ts.breaks.length?'<br>'+ts.breaks.map(a=>a.d.short).join('・')+'が崩壊':'')+'</span>':'';
    return'<button class="up'+(u.fam==='taboo'?' taboo':'')+'" data-i="'+i+'" style="--fc:'+f.col+'"'+(ts&&ts.blocked?' disabled':'')+'>'
      +'<span class="ua'+(art?' pic':'')+(own?' own':'')+'">'+(art?'<img alt="" src="'+art+'">':'')+'<i class="ug">'+u.g+'</i>'+rate+'</span>'
      +'<span class="uf">'+f.who+'</span><span class="un">'+u.name+'</span><span class="ud">'+u.desc.replace(/ (?=[+−])/g,'\u00a0').replace(/\|/g,'<wbr>')+'</span>'+cost+'<span class="ul">'+lvTxt+'</span></button>';
  }).join('');
  lvOpenAt=performance.now();elLv.classList.add('on');
}
function hideUp(){elLv.classList.remove('on')}
elLv.addEventListener('click',ev=>{
  const b=ev.target.closest('.up');if(!b||b.disabled||mode!=='levelup')return;
  if(performance.now()-lvOpenAt<UPCFG.lock*1000)return; // 誤タップ防止：出た直後は選べない
  chooseUp(+b.dataset.i);
});

/* ---- スプライト調整パネル ---- */
let tuning=false,tuneKey='fox',tuneAnim=true,pausedBefore=false;
const tuneLabel=k=>CHARS[k]?CHARS[k].name:ENEMIES[k].name;
function tuneCode(){return'NRK1 '+Object.keys(TUNE).map(k=>k+':'+TUNE[k].s+','+TUNE[k].x+','+TUNE[k].y).join(' ')}
function syncTune(){
  const t=TUNE[tuneKey];
  document.querySelectorAll('#tune .trow[data-k]').forEach(r=>{const k=r.dataset.k;r.querySelector('input').value=t[k];r.querySelector('.tv').textContent=k==='s'?t.s+'%':(t[k]>0?'+':'')+t[k]});
  $('#tuneCode').value=tuneCode();setTxt($('#tuneCopy'),'コピー');
  // 絵の見比べ：差し替え候補（<名前>2）のあるキャラだけ、今の絵／新を切り替えられる
  const L=CHARS[tuneKey]?lookList(tuneKey):[],cur=L.length>1?allyLook(tuneKey).key:'';
  $('#tuneLook').innerHTML='<span class="tl">絵</span>'+(L.length>1?L.map(o=>'<button class="tb'+(o.key===cur?' on':'')+'" data-look="'+o.key+'">'+o.name+'</button>').join(''):'<em>差し替え候補なし</em>');
}
function openTune(){
  if(mode!=='battle'||tuning)return;
  const keys=B.allies.map(a=>a.d.id).concat(Object.keys(ENEMIES));
  if(keys.indexOf(tuneKey)<0)tuneKey=keys[0];
  $('#tuneSel').innerHTML=keys.map(k=>'<option value="'+k+'"'+(k===tuneKey?' selected':'')+'>'+tuneLabel(k)+'</option>').join('');
  $('#tuneMark').checked=CFG.showAnchor;$('#tuneAnim').checked=tuneAnim;
  pausedBefore=paused;paused=true;tuning=true;aim.on=false;B.sel=null;
  $('#cmd').classList.add('tuning');syncTune();
}
function closeTune(){
  tuning=false;$('#cmd').classList.remove('tuning');
  paused=pausedBefore;setTxt($('#btnPause'),paused?'再開':'一時停止');
}
$('#tune').addEventListener('input',ev=>{const r=ev.target.closest('.trow[data-k]');if(r&&ev.target.type==='range'){TUNE[tuneKey][r.dataset.k]=+ev.target.value;saveTune();syncTune()}});
$('#tune').addEventListener('click',ev=>{
  const lb=ev.target.closest('[data-look]');if(lb){setLook(tuneKey,lb.dataset.look);syncTune();return}
  const b=ev.target.closest('.step');if(!b)return;
  const r=b.closest('.trow'),inp=r.querySelector('input'),k=r.dataset.k;
  TUNE[tuneKey][k]=clamp(TUNE[tuneKey][k]+(+b.dataset.d),+inp.min,+inp.max);saveTune();syncTune();
});
$('#tuneSel').addEventListener('change',ev=>{tuneKey=ev.target.value;syncTune()});
$('#tuneAnim').addEventListener('change',ev=>{tuneAnim=ev.target.checked});
$('#tuneMark').addEventListener('change',ev=>{CFG.showAnchor=ev.target.checked});
$('#tuneClose').addEventListener('click',closeTune);
$('#tuneReset').addEventListener('click',()=>{Object.assign(TUNE[tuneKey],TUNE_BASE[tuneKey]);saveTune();syncTune()});
$('#tuneCopy').addEventListener('click',()=>{
  const el=$('#tuneCode'),ok=()=>setTxt($('#tuneCopy'),'コピー済み'),manual=()=>{el.focus();el.select();try{if(document.execCommand('copy'))ok();else setTxt($('#tuneCopy'),'長押しで選択')}catch(e){setTxt($('#tuneCopy'),'長押しで選択')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(ok,manual);else manual();
});

// 戦闘の札は指が触れた瞬間（pointerdown）に反応させる。click は指を離すまで待ち、その間に手札が描き直されると消えていた
function handPick(ev){
  const el=ev.target.closest&&ev.target.closest('.card');if(!el||!B||mode!=='battle'||paused||ULT)return;
  const i=+el.dataset.i,s=B.slots[i];if(!s||!s.card)return;
  if(s.card.kind==='instant'){HFLASH={msg:s.card.name+'：'+s.card.desc,until:performance.now()+1600};useCard(i,0,0)}else B.sel=B.sel===i?null:i;
}
let handDownT=-1e9;
elHand.addEventListener('pointerdown',ev=>{if(R&&!B)return;if(ev.button>0)return;handDownT=performance.now();handPick(ev);ev.preventDefault()});
elHand.addEventListener('pointerup',()=>{handDownT=performance.now()}); // 長押しのあとの click も無視する
elHand.addEventListener('click',ev=>{
  if(R&&!B){ // 探索中：行き先の札。1回目で選び、同じ札をもう一度押すと進む
    const nb=ev.target.closest('[data-node]');if(!nb||mode!=='map'||R.walk)return;
    const id=+nb.dataset.node;if(R.sel===id)travel(id);else R.sel=id;
    return;
  }
  if(performance.now()-handDownT>1000)handPick(ev); // キーボード操作など pointerdown を伴わないときだけ（指・マウスは処理済み）
});
function toArena(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',ev=>{
  if(mode==='map'){ // 探索中：マスをタップすると、そのマスの情報を見られる（進むのは下の札かボタン）
    if(R.walk)return;
    const p=toArena(ev);let best=null,bd=36*36;
    for(const n of R.map.nodes){const q=mapXY(n),d=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y);if(d<bd){bd=d;best=n}}
    R.sel=best?best.id:null;ev.preventDefault();return;
  }
  if(mode!=='battle'||paused||B.sel==null)return;
  const p=toArena(ev);aim.on=true;aim.x=p.x;aim.y=p.y;
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  ev.preventDefault();
});
cv.addEventListener('pointermove',ev=>{if(!aim.on)return;const p=toArena(ev);aim.x=clamp(p.x,0,W);aim.y=clamp(p.y,0,H)});
cv.addEventListener('pointerup',ev=>{if(!aim.on)return;aim.on=false;if(mode==='battle'&&!paused&&B.sel!=null)useCard(B.sel,aim.x,aim.y)});
cv.addEventListener('pointercancel',()=>{aim.on=false});
$('#btnRewind').addEventListener('click',()=>startRewind());
$('#btnPause').addEventListener('click',()=>{if(mode!=='battle')return;paused=!paused;aim.on=false;setTxt($('#btnPause'),paused?'再開':'一時停止')});
$('#btnSpeed').addEventListener('click',()=>{speed=speed===1?2:1;setTxt($('#btnSpeed'),speed===1?'等速':'倍速')});
$('#btnTune').addEventListener('click',openTune);
elRail.addEventListener('animationend',ev=>{if(ev.animationName==='railIn')elRail.classList.remove('enter')});
$('#btnGo').addEventListener('click',()=>{if(mode==='map'&&R.sel!=null)travel(R.sel)});
$('#btnBack').addEventListener('click',askRetreat);
$('#btnBag').addEventListener('click',askBag);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='battle'&&!paused){paused=true;setTxt($('#btnPause'),'再開')}});

/* =========================================================
   9. メインループ
   ========================================================= */
let last=0,accum=0;
function resize(){
  if(HUBS)hubLayout();
  fitRail();
  const r=$('#arena').getBoundingClientRect();if(r.width<10||r.height<10)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  // 戦闘中は論理サイズを固定する（画面の伸縮で敵の位置関係が変わらないように）
  const inBattle=!!B&&(mode==='battle'||mode==='levelup'||mode==='rewinding'||mode==='defeat');
  if(!inBattle){H=clamp(W*r.height/r.width,380,1000);buildBG()}
  VSx=cv.width/W;VSy=cv.height/H;
}
function frame(ts){
  const dtR=Math.min(0.1,(ts-last)/1000||0);last=ts;
  if(ULT)ultSync();
  if(mode==='battle'&&!paused&&ULT)updUlt(dtR); // 超必殺のカットイン中は戦闘を止める
  else if(mode==='battle'&&!paused){
    accum+=dtR*speed;let n=0;
    while(accum>=STEP&&n<10){step(STEP);accum-=STEP;n++;if(mode!=='battle')break}
    if(n>=10)accum=0;
    updFX(dtR*speed);
  }else if(mode==='rewinding'){updRewind(dtR);updFX(dtR)}
  else if(mode==='map'||mode==='node'){updMap(dtR);updFX(dtR)}
  else if(mode!=='battle'&&mode!=='levelup')updFX(dtR); // 強化の選択中は演出も含めて完全停止
  if(mode==='town')hubTick(ts/1000); // 街の演出（灯り・煙・布・駒）
  if(R&&!B)drawMap(ts/1000);else render(ts/1000);
  syncDOM();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('#arena'));

/* 検証用の入口（自動テストとデバッグ用。ゲーム進行には影響しない） */
window.NARAKU={
  get B(){return B},get P(){return P},get R(){return R},get mode(){return mode},CFG,SPR,CARDS,CHARS,TUNE,FX,ENEMIES,UPS,UPCFG,FAMS,UPARTS,BG_KEYS,setBg(k){bgPick=k},
  XCFG,BKINDS,NODES,EVENTS,SHOP,GCFG,TCFG,TSHOP,RAR,AFFIX,genMap,bgFor,get S(){return S},get saveOk(){return SAVE_OK},
  // start=単発の戦闘（opt省略でStep 2までと同じ180秒戦。{kind,depth}で探索中の戦闘を再現できる）/ startRun=探索を始める
  start:(ids,seed,opt)=>beginTrial(ids,seed,opt),
  // fresh=まっさらな街にする（自動保存は切る。検証が本物の記録を書き換えないように）/ sortie=今の街の状態で出撃 / startRun=まっさらな街から、その3人で出撃
  fresh(){SAVE_ON=false;S=newSave();showTown();return S},sortie(seed){townParty();if(!canDive())return false;beginRun(seed);return true},
  startRun(ids,seed,floor){SAVE_ON=false;S=newSave();S.picks=ids.slice();if(floor){S.floorMax=Math.max(S.floorMax,floor);S.floor=floor}beginRun(seed)},
  // 街の操作と装備・セーブ
  town:{show:showTown,view:showView,pick:togglePick,equip:equipItem,unequip,enhance,breakItem,breakAll,inn:innStay,revive,buy:shopBuy,floor:setFloor,bank:bankLoot},
  look:{set:setLook,get:id=>allyLook(id).key,frames:id=>allyLook(id).seq.length,list:id=>lookList(id).map(o=>o.key)},
  hub:{HUB,select:hubSelect,enter:hubEnter,tick:hubTick,get sel(){return HSEL},get on(){return!!HUBS}},
  MOTION,MOTION_DEF,HIT_AT,motionOf,frameAt,
  mkItem,gearStats,itemName,itemPow,itemLines,enhCost,exportCode,importCode,fixSave,saveText:o=>saveText(o),loadSave,resume:resumeRun,bag:askBag,use:useBag,rng:mulberry32,
  // 探索の操作。go=1歩進んでマスを開く（移動の演出は省く）/ info=そのマスの見え方 / choose・buy・leave=各マスの画面 / next=勝利後 / giveUp=敗北後 / retreat=街へ帰還
  go(id){if(!stepTo(id))return false;arrive();return mode},
  info:id=>nodeInfo(id),light:()=>lightState(),nodeXY:id=>{R.camY=null;const q=mapXY(R.map.nodes[id]);return{x:q.x/W,y:q.y/H}},choose:chooseNode,buy:buyItem,leave:leaveNode,next:afterVictory,giveUp,
  retreat(){if(mode!=='map'||R.walk)return false;endRun('return');return true},
  useCard,startRewind,updRewind,dropSig,dropFor,get ULT(){return ULT},ULT_DEF,startUlt,
  pick:chooseUp,
  grant(id){const u=UPS.find(x=>x.id===id);if(!u||!B)return false;applyUp(u);return true},
  // bot=スキルを撃つ自動操縦 / pick=強化を選ぶ関数（提示3枚と B を受け取り番号を返す。省略すると何も取らない）
  sim(sec,bot,pick){
    const n=Math.round(sec*60);
    for(let i=0;i<n;i++){
      if(mode==='levelup'){if(!chooseUp(pick?pick(B.offer,B):-1))chooseUp(-1);i--;continue}
      if(mode!=='battle')break;
      if(ULT){updUlt(STEP);i--;continue} // カットインの時間は戦闘の秒数に数えない（強化の選択と同じ）
      if(bot&&i%6===0)bot(B);
      step(STEP);
    }
    return mode;
  }
};

buildPlaceholders();
resize();
loadEmbedded().then(()=>{
  window.NARAKU_READY=true;
  S=loadSave()||newSave(); // 自動保存があれば続きから。探索の途中で閉じていたら、そのマスから再開する
  if(S.run)showResume();else showTown();
  requestAnimationFrame(frame);
});
